<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hue Lines — Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="theme-color" content="#0b1117">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e1e5ea;
    }

    .login-container {
      width: 100%;
      max-width: 360px;
      padding: 2rem;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo img {
      height: 48px;
      opacity: 0.9;
    }

    .login-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 2rem;
    }

    .login-card h1 {
      font-size: 1.1rem;
      font-weight: 500;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #c0c8d4;
    }

    .input-group {
      position: relative;
      margin-bottom: 1rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e1e5ea;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: rgba(100, 140, 255, 0.5);
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #4a6cf7, #6366f1);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .login-btn:hover { opacity: 0.9; }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      margin-top: 1rem;
      padding: 0.6rem 0.8rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .error-msg.visible { display: block; }

    .lockout-timer {
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <img src="/logo-horizontal.png" alt="Hue Lines">
    </div>
    <div class="login-card">
      <h1 id="heading">Enter Password</h1>
      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            autofocus
          >
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Log In</button>
      </form>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <script>
    (async function() {
      // Check if already logged in
      try {
        const s = await fetch('/api/auth/status').then(r => r.json());
        if (s.authenticated) { window.location.href = '/'; return; }
        if (!s.hasPassword) {
          document.getElementById('heading').textContent = 'Create Password';
          document.getElementById('loginBtn').textContent = 'Set Password';
          document.getElementById('password').placeholder = 'Choose a password';
        }
      } catch {}

      const form = document.getElementById('loginForm');
      const pw = document.getElementById('password');
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!pw.value.trim()) return;
        btn.disabled = true;
        errEl.classList.remove('visible');

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw.value }),
          });
          const data = await res.json();

          if (res.ok) {
            window.location.href = '/';
          } else {
            errEl.textContent = data.error || 'Login failed';
            errEl.classList.add('visible');
            pw.value = '';
            pw.focus();
          }
        } catch {
          errEl.textContent = 'Connection error. Try again.';
          errEl.classList.add('visible');
        }

        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
